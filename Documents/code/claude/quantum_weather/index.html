<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantum Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #111118;
      border-right: 1px solid #222;
      overflow-y: auto;
      padding-bottom: 24px;
      z-index: 30;
      transition: width 0.25s ease, border-color 0.25s ease, overflow 0.25s ease;
    }
    #sidebar.ui-hidden {
      width: 0;
      overflow: hidden;
      border-right-color: transparent;
    }

    #sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid #222;
    }
    #sidebar-header p {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    #sidebar-header h1 {
      font-size: 13px;
      font-weight: 400;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #status {
      margin: 10px 12px 0;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 10px;
      color: #4a9eff;
      background: rgba(74,158,255,.12);
    }

    /* ── Control sections ── */
    .ctrl-section {
      margin: 10px 12px 0;
      padding: 10px;
      border: 1px solid #222;
      border-radius: 6px;
    }
    .ctrl-section h3 {
      font-size: 10px;
      font-weight: 400;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .ctrl-row:last-child { margin-bottom: 0; }
    .ctrl-row label {
      font-size: 11px;
      color: #888;
      width: 60px;
      flex-shrink: 0;
    }
    .ctrl-row input[type=range] {
      flex: 1;
      accent-color: #4a9eff;
    }
    .ctrl-row span {
      font-size: 11px;
      color: #aaa;
      width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    #hint {
      margin: 14px 12px 0;
      font-size: 10px;
      color: #333;
      letter-spacing: 0.3px;
    }
    #hint b { color: #555; }

    #canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #070710;
    }
    /* Aspect-ratio box — canvas fills this; the box never distorts. */
    #canvas-frame {
      aspect-ratio: 10 / 3;   /* 2560 ÷ 768 = 10 ÷ 3  (exact) */
      max-width: 100%;
      max-height: 100%;
      outline: 1px solid #1a1a30;
      box-shadow: 0 0 40px rgba(30, 60, 120, 0.4);
      overflow: hidden;
    }
    #canvas-frame canvas {
      display: block;
      width: 100% !important;   /* override Three.js inline style */
      height: 100% !important;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <p>Future Interactions</p>
      <h1>Quantum Weather</h1>
    </div>

    <div id="status">Loading…</div>

    <!-- Playback -->
    <div class="ctrl-section">
      <h3>Playback</h3>
      <div class="ctrl-row">
        <label>Frame delay</label>
        <input type="range" id="frame-duration" min="30" max="600" step="30" value="240">
        <span id="frame-duration-val">240</span>
      </div>
    </div>

    <!-- Swarm -->
    <div class="ctrl-section">
      <h3>Swarm</h3>
      <div class="ctrl-row">
        <label>Arrows</label>
        <input type="range" id="arrow-count" min="100" max="10000" step="100" value="1400">
        <span id="arrow-count-val">1400</span>
      </div>
      <div class="ctrl-row">
        <label>Speed</label>
        <input type="range" id="flow-speed" min="0.01" max="0.5" step="0.01" value="0.1">
        <span id="flow-speed-val">0.10</span>
      </div>
      <div class="ctrl-row">
        <label>Scale</label>
        <input type="range" id="scale" min="10" max="100" step="1" value="40">
        <span id="scale-val">40</span>
      </div>
      <div class="ctrl-row">
        <label>Calm glow</label>
        <input type="range" id="alpha-min" min="0" max="1" step="0.05" value="0.35">
        <span id="alpha-min-val">0.35</span>
      </div>
      <div class="ctrl-row">
        <label>Trail</label>
        <input type="range" id="trail-length" min="0" max="120" step="1" value="0">
        <span id="trail-length-val">0</span>
      </div>
    </div>

    <!-- Lifetime -->
    <div class="ctrl-section">
      <h3>Lifetime</h3>
      <div class="ctrl-row">
        <label>Life min</label>
        <input type="range" id="life-min" min="30" max="600" step="10" value="120">
        <span id="life-min-val">120</span>
      </div>
      <div class="ctrl-row">
        <label>Life max</label>
        <input type="range" id="life-max" min="30" max="600" step="10" value="360">
        <span id="life-max-val">360</span>
      </div>
      <div class="ctrl-row">
        <label>Fade</label>
        <input type="range" id="fade-frames" min="5" max="100" step="5" value="30">
        <span id="fade-frames-val">30</span>
      </div>
    </div>

    <!-- Colour -->
    <div class="ctrl-section">
      <h3>Colour</h3>
      <div class="ctrl-row">
        <label>Hue</label>
        <input type="range" id="hue-offset" min="0" max="1" step="0.01" value="0.55">
        <span id="hue-offset-val">0.55</span>
      </div>
      <div class="ctrl-row">
        <label>Range</label>
        <input type="range" id="hue-range" min="0" max="1" step="0.01" value="0.15">
        <span id="hue-range-val">0.15</span>
      </div>
      <div class="ctrl-row">
        <label>Sat</label>
        <input type="range" id="saturation" min="0" max="1" step="0.01" value="0.85">
        <span id="saturation-val">0.85</span>
      </div>
      <div class="ctrl-row">
        <label>Lightness</label>
        <input type="range" id="lightness" min="0.1" max="0.9" step="0.01" value="0.5">
        <span id="lightness-val">0.50</span>
      </div>
      <div class="ctrl-row">
        <label>Brt floor</label>
        <input type="range" id="bright-floor" min="0" max="0.6" step="0.01" value="0.25">
        <span id="bright-floor-val">0.25</span>
      </div>
      <div class="ctrl-row">
        <label>Smooth</label>
        <input type="range" id="colour-smooth" min="0.01" max="0.5" step="0.01" value="0.04">
        <span id="colour-smooth-val">0.04</span>
      </div>
      <div class="ctrl-row">
        <label>Spd colour</label>
        <input type="range" id="speed-colour" min="0" max="1" step="0.05" value="0">
        <span id="speed-colour-val">0.00</span>
      </div>
      <div class="ctrl-row">
        <label>Convergence</label>
        <input type="range" id="div-colour" min="0" max="1" step="0.05" value="0">
        <span id="div-colour-val">0.00</span>
      </div>
      <div class="ctrl-row">
        <label>Vorticity</label>
        <input type="range" id="vort-colour" min="0" max="1" step="0.05" value="0">
        <span id="vort-colour-val">0.00</span>
      </div>
      <div class="ctrl-row">
        <label>Intensity</label>
        <input type="range" id="intensity-boost" min="1" max="5" step="0.1" value="1">
        <span id="intensity-boost-val">1.0</span>
      </div>
    </div>

    <!-- Map / Field -->
    <div class="ctrl-section">
      <h3>Map / Field</h3>
      <div class="ctrl-row">
        <label>Map</label>
        <input type="range" id="map-opacity" min="0" max="1" step="0.05" value="0.9">
        <span id="map-opacity-val">0.90</span>
      </div>
      <div class="ctrl-row">
        <label>Wind field</label>
        <input type="range" id="wind-opacity" min="0" max="1" step="0.05" value="1.0">
        <span id="wind-opacity-val">1.00</span>
      </div>
      <div class="ctrl-row">
        <label>Isobars</label>
        <input type="range" id="isobar-opacity" min="0" max="1" step="0.05" value="0.7">
        <span id="isobar-opacity-val">0.70</span>
      </div>
    </div>

    <!-- Bloom -->
    <div class="ctrl-section">
      <h3>Bloom</h3>
      <div class="ctrl-row">
        <label>Strength</label>
        <input type="range" id="bloom-strength" min="0" max="5" step="0.1" value="0.0">
        <span id="bloom-strength-val">0.0</span>
      </div>
      <div class="ctrl-row">
        <label>Radius</label>
        <input type="range" id="bloom-radius" min="0" max="2" step="0.05" value="0.15">
        <span id="bloom-radius-val">0.15</span>
      </div>
      <div class="ctrl-row">
        <label>Threshold</label>
        <input type="range" id="bloom-thresh" min="0" max="1" step="0.01" value="0.40">
        <span id="bloom-thresh-val">0.40</span>
      </div>
    </div>

    <div id="hint"><b>[S]</b> screenshot &nbsp; <b>[H]</b> hide UI &nbsp; <b>[G]</b> landmarks &nbsp; <b>[T]</b> track pin</div>
  </aside>

  <div id="canvas-wrap">
    <div id="canvas-frame"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
